<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="../src/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .tech-title { font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 1px; }
  </style>
</head>

<body class="bg-slate-200 flex items-center justify-center min-h-screen">

  <div class="flex w-[900px] bg-white rounded-2xl shadow-xl overflow-hidden">

    <!-- CONTAINER ESQUERDO (FORM REGISTRO) -->
    <div class="w-1/2 p-10 flex flex-col justify-center">

      <h1 class="text-3xl font-semibold text-slate-800 mb-2">Crie sua conta</h1>
      <p class="text-slate-500 mb-6">Comece a organizar sua rotina hoje</p>

      <form class="space-y-4">

        <div>
          <label class="text-sm text-slate-600">Nome</label>
          <input type="text" placeholder="Seu nome"
            class="w-full mt-1 p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="text-sm text-slate-600">E-mail</label>
          <input type="email" placeholder="seu@email.com"
            class="w-full mt-1 p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="text-sm text-slate-600">Senha</label>
          <input type="password" placeholder="********"
            class="w-full mt-1 p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- 🔧 RBAC (regra crítica de segurança): o seletor de Perfil foi REMOVIDO.
             Todo cadastro público nasce como MEMBER; promoção a MANAGER/ADMIN só por um ADMIN dentro do sistema. -->

        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg transition font-semibold">
          Criar conta
        </button>

        <div id="msg-feedback" class="hidden p-3 rounded-md text-sm font-medium mb-4 text-center"></div>

        <a href="login.html"
          class="block text-center w-full border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white p-3 rounded-lg transition font-medium">
          Já tenho conta
        </a>

      </form>
    </div>

    <!-- CONTAINER DIREITO -->
    <div class="w-1/2 bg-blue-100 flex items-center justify-center">
      <div class="px-10">
        <h2 class="tech-title text-5xl text-blue-700 leading-tight mb-6 tracking-wider">
          Comece <br>agora <br>mesmo
        </h2>
        <p class="text-sm text-slate-600 max-w-xs leading-relaxed">
          Crie sua conta e tenha controle total das suas tarefas de forma simples e eficiente.
        </p>
      </div>
    </div>

  </div>

  <script type="module" src="../src/js/auth/register.js"></script>
</body>
</html>
